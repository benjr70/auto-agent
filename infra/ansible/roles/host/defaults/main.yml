# Set by the engine's vars file; the defaults only make the role parse alone.
aa_host_user: "{{ ansible_user_id }}"
aa_install_dir: ""
aa_target_dir: ""
aa_state_dir: ""
aa_host_env_path: ""
aa_host_env_content: ""
aa_unit_dir: /etc/systemd/system
# Base needs, derived by the engine from the Harness config's Surfaces and
# host.docker (ADR 0004). Everything else is the Host extension's job.
aa_needs:
  display: false
  browser: false
  electron: false
  docker: false
aa_display: ":99"
aa_xvfb_screen: "1920x1080x24"
# The paths an AppArmor profile grants user namespaces to (ticket #19: the
# OS's own mechanism for Chrome): each electron Surface's launcher, and the
# Electron binaries they start. Empty lists write no profile.
aa_electron:
  launchers: []
  binaries: []

# What every Host carries: the Daemon's own runtime.
# python3-debian: what the deb822_repository module needs on the Host.
aa_packages_base: [git, jq, curl, ca-certificates, python3, python3-debian, gh]
# A real display for the screenshot tour: Xvfb on a fixed DISPLAY plus the
# reference fonts (ticket #19 finding 2: without them sans-serif resolves to
# Liberation Mono and the tour stops matching a desktop capture).
aa_packages_display: [xvfb, x11-utils, xauth, fontconfig, fonts-noto-core, fonts-noto-color-emoji, fonts-liberation]
# npx runs the MCP server the browser and electron Surfaces are driven through.
aa_packages_node: [nodejs, npm]
aa_packages_electron: [libgtk-3-0t64, libnss3, libasound2t64, libxss1, libgbm1, libatk-bridge2.0-0t64, libdrm2, libxkbcommon0, libnotify4, libxtst6]
aa_packages_docker: [docker.io, docker-compose-v2]
