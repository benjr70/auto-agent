# The configure step's Ansible settings: `bin/auto-agent setup` runs
# configure.yml with ANSIBLE_CONFIG pointing here, so an operator's own
# ansible.cfg never changes what a Host gets.
[defaults]
roles_path = roles
retry_files_enabled = False
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
# A no_log task still prints its name; its arguments never reach a log.
no_target_syslog = True

[privilege_escalation]
become_method = sudo
become_ask_pass = False
