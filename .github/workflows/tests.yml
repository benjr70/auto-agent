name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  suites:
    name: Harness test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The Go Daemon is built beside the bash one (ADR 0014); both are checked.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      # The fixture suites detect the repo's default branch through gh.
      - run: bash run-tests.sh
        env:
          GH_TOKEN: ${{ github.token }}
