name: release
# A semver tag publishes a GitHub Release carrying the binary for every platform
# and a SHA256SUMS. Nothing else triggers it. cmd/auto-agent/release_test.go
# pins this file's trigger and order, and runs its Build step.
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  release:
    name: Release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A failed test fails the job, so nothing below runs and nothing is published.
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          pkg=github.com/benjr70/auto-agent/internal/version
          tag="$GITHUB_REF_NAME"
          commit="${GITHUB_SHA:0:12}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            out="dist/auto-agent-$tag-${target%/*}-${target#*/}"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath \
              -ldflags "-s -w -X $pkg.version=$tag -X $pkg.commit=$commit" \
              -o "$out" ./cmd/auto-agent
          done
          (cd dist && sha256sum auto-agent-* > SHA256SUMS)
      - name: Publish
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
